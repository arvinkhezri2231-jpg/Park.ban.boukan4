name: Build ParkBan POS APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create release signing key
        env:
          PARKBAN_KEYSTORE_PASSWORD: ${{ secrets.PARKBAN_KEYSTORE_PASSWORD }}
          PARKBAN_KEY_PASSWORD: ${{ secrets.PARKBAN_KEY_PASSWORD }}
          PARKBAN_KEY_ALIAS: ${{ secrets.PARKBAN_KEY_ALIAS }}

        run: |

          KS_PASS="${PARKBAN_KEYSTORE_PASSWORD:-ParkBanTemp_2026}"
          KEY_PASS="${PARKBAN_KEY_PASSWORD:-ParkBanTemp_2026}"
          ALIAS="${PARKBAN_KEY_ALIAS:-parkban}"

          keytool -genkeypair -v \
            -keystore app/parkban-release.jks \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=ParkBan, OU=ParkBan, O=ParkBan, L=Bukan, ST=West Azerbaijan, C=IR"

          echo "PARKBAN_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

          echo "PARKBAN_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          echo "PARKBAN_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature
        run: |

          APK="app/build/outputs/apk/release/app-release.apk"

          apksigner verify \
            --verbose \
            --min-sdk-version 23 \
            "$APK"

      - name: Rename APK
        run: |

          cp \
          app/build/outputs/apk/release/app-release.apk \
          ParkBan.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: ParkBan-POS-APK
          path: ParkBan.apk
          if-no-files-found: error
          retention-days: 30
